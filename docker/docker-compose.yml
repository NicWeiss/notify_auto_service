version: "3.6"


x-logging:
  &default-logging
  driver: json-file
  options:
    max-size: '1m'
    max-file: '1'


services:

  postgres:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_USER: test
      POSTGRES_DB: test
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    ports:
      - "8097:5432"
    container_name: dev_notifier_postgres


  backend_base:
    &backend_base
    build:
      dockerfile: docker/backend/Dockerfile
      context: ../
      target: prod
    env_file:
      - ../backend_go/.env
    links:
      - postgres
      - postfix
    depends_on:
      - postgres
      - postfix
    container_name: dev_notifier_backend_base

  backend:
    <<: *backend_base
    ports:
      - "8094:8800"
    container_name: dev_notifier_backend


  frontend:
    build:
      dockerfile: ./docker/frontend/Dockerfile
      context: ../
      target: dev
    ports:
      - "8093:4200"
    volumes:
      - ../frontend/app:/frontend/app
      - ../frontend/config:/frontend/config
      - ../frontend/public:/frontend/public
      - ../frontend/vendor:/frontend/vendor
      - ../frontend/.ember-cli:/frontend/.ember-cli
      - ../frontend/app.json:/frontend/app.json
      - ../frontend/ember-cli-build.js:/frontend/ember-cli-build.js
      - ../frontend/package.json:/frontend/package.json
#    depends_on:
#      - backend
    working_dir: /frontend
    command: ember s
    container_name: dev_notifier_frontend

  postfix:
    build:
      dockerfile: ./docker/postfix/Dockerfile
      context: ../
    ports:
      - "25:25"
      - "587:587"
    restart: always
    command: bash -c "/run.sh"
    container_name: dev_notifier_postfix
    stdin_open: true
    tty: true
    logging: *default-logging

