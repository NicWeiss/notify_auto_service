basePath: /api/v3
definitions:
  api_utils.ErrorResponse:
    properties:
      detail:
        type: string
    type: object
  api_utils.StatusResponse:
    properties:
      status:
        type: string
    type: object
  models.Acceptor:
    properties:
      account:
        type: string
      id:
        type: integer
      is_deleted:
        type: boolean
      is_disabled:
        type: boolean
      is_system:
        type: boolean
      name:
        type: string
      system_id:
        type: integer
      user_id:
        type: integer
    type: object
  models.Category:
    properties:
      id:
        type: integer
      is_deleted:
        type: boolean
      is_hidden:
        type: boolean
      name:
        type: string
      user_id:
        type: integer
    type: object
  models.ClientInfo:
    properties:
      client:
        type: string
      cookies:
        type: boolean
      mobile:
        type: boolean
      os:
        type: string
      os_version:
        type: string
      screen:
        type: string
      version:
        type: string
    type: object
  models.Notify:
    properties:
      acceptors:
        items:
          $ref: '#/definitions/models.Acceptor'
        type: array
      autodisable_at:
        type: string
      category_id:
        type: integer
      date:
        type: string
      day_of_week:
        type: integer
      id:
        type: integer
      is_autodisable:
        type: boolean
      is_deleted:
        type: boolean
      is_disabled:
        type: boolean
      name:
        type: string
      periodic:
        type: string
      repeate_interval:
        type: integer
      text:
        type: string
      time:
        type: string
      user_id:
        type: integer
    type: object
  models.Session:
    properties:
      client:
        type: object
      expire_at:
        type: string
      id:
        type: integer
      is_deleted:
        type: boolean
      location:
        type: object
      session:
        type: string
      user_id:
        type: integer
    type: object
  models.System:
    properties:
      help:
        type: string
      id:
        type: integer
      is_deleted:
        type: boolean
      is_disabled:
        type: boolean
      is_system:
        type: boolean
      name:
        type: string
      type:
        type: string
    type: object
  models.User:
    properties:
      email:
        type: string
      id:
        type: integer
      is_deleted:
        type: boolean
      name:
        type: string
      registred_at:
        type: string
    type: object
  schemas.AcceptorCreateFields:
    properties:
      account:
        type: string
      is_disabled:
        type: boolean
      is_system:
        type: boolean
      name:
        type: string
      system_id:
        type: integer
    required:
    - name
    - system_id
    type: object
  schemas.AcceptorCreateParams:
    properties:
      acceptor:
        $ref: '#/definitions/schemas.AcceptorCreateFields'
    required:
    - acceptor
    type: object
  schemas.AcceptorRef:
    properties:
      id:
        type: integer
    type: object
  schemas.AcceptorUpdateFields:
    properties:
      account:
        type: string
      is_disabled:
        type: boolean
      name:
        type: string
      system_id:
        type: integer
    type: object
  schemas.AcceptorUpdateParams:
    properties:
      acceptor:
        $ref: '#/definitions/schemas.AcceptorUpdateFields'
    required:
    - acceptor
    type: object
  schemas.CategoryFields:
    properties:
      is_hidden:
        type: boolean
      name:
        type: string
    required:
    - name
    type: object
  schemas.CategoryParams:
    properties:
      category:
        $ref: '#/definitions/schemas.CategoryFields'
    required:
    - category
    type: object
  schemas.ChangePasswordParams:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    required:
    - current_password
    - new_password
    type: object
  schemas.CodeRequestParams:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  schemas.DataResponse:
    properties:
      data:
        additionalProperties: {}
        type: object
    type: object
  schemas.EmberAcceptor:
    properties:
      acceptor:
        $ref: '#/definitions/models.Acceptor'
      meta:
        $ref: '#/definitions/schemas.EmberMeta'
    type: object
  schemas.EmberAcceptors:
    properties:
      acceptor:
        items:
          $ref: '#/definitions/models.Acceptor'
        type: array
      meta:
        $ref: '#/definitions/schemas.EmberMeta'
    type: object
  schemas.EmberCategories:
    properties:
      category:
        items:
          $ref: '#/definitions/models.Category'
        type: array
      meta:
        $ref: '#/definitions/schemas.EmberMeta'
    type: object
  schemas.EmberCategory:
    properties:
      category:
        $ref: '#/definitions/models.Category'
      meta:
        $ref: '#/definitions/schemas.EmberMeta'
    type: object
  schemas.EmberMeta:
    properties:
      total_pages:
        type: integer
    type: object
  schemas.EmberNotifies:
    properties:
      meta:
        $ref: '#/definitions/schemas.EmberMeta'
      notify:
        items:
          $ref: '#/definitions/models.Notify'
        type: array
    type: object
  schemas.EmberNotify:
    properties:
      meta:
        $ref: '#/definitions/schemas.EmberMeta'
      notify:
        $ref: '#/definitions/models.Notify'
    type: object
  schemas.EmberSessions:
    properties:
      meta:
        $ref: '#/definitions/schemas.EmberMeta'
      session:
        items:
          $ref: '#/definitions/models.Session'
        type: array
    type: object
  schemas.EmberSystem:
    properties:
      meta:
        $ref: '#/definitions/schemas.EmberMeta'
      system:
        $ref: '#/definitions/models.System'
    type: object
  schemas.EmberSystems:
    properties:
      meta:
        $ref: '#/definitions/schemas.EmberMeta'
      system:
        items:
          $ref: '#/definitions/models.System'
        type: array
    type: object
  schemas.EmberUser:
    properties:
      meta:
        $ref: '#/definitions/schemas.EmberMeta'
      user:
        $ref: '#/definitions/models.User'
    type: object
  schemas.LoginParams:
    properties:
      client:
        $ref: '#/definitions/models.ClientInfo'
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  schemas.NotifyCategoryParams:
    properties:
      category_id:
        type: integer
    required:
    - category_id
    type: object
  schemas.NotifyFields:
    properties:
      acceptors:
        items:
          $ref: '#/definitions/schemas.AcceptorRef'
        type: array
      autodisable_at:
        type: string
      category_id:
        type: integer
      date:
        type: string
      day_of_week:
        type: integer
      is_autodisable:
        type: boolean
      is_disabled:
        type: boolean
      name:
        type: string
      periodic:
        type: string
      repeate_interval:
        type: integer
      text:
        type: string
      time:
        type: string
    type: object
  schemas.NotifyParams:
    properties:
      notify:
        $ref: '#/definitions/schemas.NotifyFields'
    required:
    - notify
    type: object
  schemas.PushTokenParams:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  schemas.RestoreParams:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  schemas.RestorePasswordParams:
    properties:
      code:
        type: string
      password:
        type: string
    required:
    - code
    - password
    type: object
  schemas.RestoreVerifyCodeParams:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  schemas.SessionResponse:
    properties:
      session:
        type: string
    type: object
  schemas.SignUpParams:
    properties:
      client:
        $ref: '#/definitions/models.ClientInfo'
      code:
        type: string
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - code
    - email
    - name
    - password
    type: object
  schemas.UserUpdateFields:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  schemas.UserUpdateParams:
    properties:
      user:
        $ref: '#/definitions/schemas.UserUpdateFields'
    required:
    - user
    type: object
info:
  contact: {}
  title: Notifier
  version: "3.0"
paths:
  /acceptors:
    get:
      description: Getting acceptors which user created
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Skip disabled acceptors
        in: query
        name: only_enabled
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of acceptors
          schema:
            $ref: '#/definitions/schemas.EmberAcceptors'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Getting acceptors
      tags:
      - Acceptor
    post:
      consumes:
      - application/json
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Acceptor
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.AcceptorCreateParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.EmberAcceptor'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Create acceptor
      tags:
      - Acceptor
  /acceptors/{id}:
    delete:
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Acceptor id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.EmberAcceptor'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Delete acceptor
      tags:
      - Acceptor
    put:
      consumes:
      - application/json
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Acceptor id
        in: path
        name: id
        required: true
        type: integer
      - description: Acceptor
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.AcceptorUpdateParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.EmberAcceptor'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Update acceptor
      tags:
      - Acceptor
  /acceptors/update_push_tokens:
    post:
      consumes:
      - application/json
      description: Add a firebase token of the device to the push acceptor
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.PushTokenParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.EmberAcceptor'
      summary: Add push token
      tags:
      - Acceptor
  /auth/get_code:
    post:
      consumes:
      - application/json
      description: Send a code for the registration to the email
      parameters:
      - description: Email
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.CodeRequestParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_utils.StatusResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Get registration code
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login, create new session and return its token
      parameters:
      - description: Login credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.LoginParams'
      produces:
      - application/json
      responses:
        "200":
          description: Session token
          schema:
            $ref: '#/definitions/schemas.SessionResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Login in system
      tags:
      - Auth
  /auth/restore:
    post:
      consumes:
      - application/json
      description: Send a link for the password restoring to the email
      parameters:
      - description: Email
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.RestoreParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DataResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Restore password
      tags:
      - Auth
  /auth/restore/restore-password:
    post:
      consumes:
      - application/json
      description: Change the password by the code from the restore link
      parameters:
      - description: Code and the new password
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.RestorePasswordParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DataResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Set new password
      tags:
      - Auth
  /auth/restore/verify-restore-code:
    post:
      consumes:
      - application/json
      description: Check that the code from the restore link is alive
      parameters:
      - description: Code
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.RestoreVerifyCodeParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.DataResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Verify restore code
      tags:
      - Auth
  /auth/sign_up:
    post:
      consumes:
      - application/json
      description: Register a new user by the code from the letter and create a session
      parameters:
      - description: Registration data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.SignUpParams'
      produces:
      - application/json
      responses:
        "200":
          description: Session token
          schema:
            $ref: '#/definitions/schemas.SessionResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Sign up
      tags:
      - Auth
  /categories:
    get:
      description: Getting notify categories which user created
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of categories
          schema:
            $ref: '#/definitions/schemas.EmberCategories'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Getting notify categories
      tags:
      - Category
    post:
      consumes:
      - application/json
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Category
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.CategoryParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.EmberCategory'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Create category
      tags:
      - Category
  /categories/{id}:
    delete:
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Category id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.EmberCategory'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Delete category
      tags:
      - Category
    put:
      consumes:
      - application/json
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Category id
        in: path
        name: id
        required: true
        type: integer
      - description: Category
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.CategoryParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.EmberCategory'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Update category
      tags:
      - Category
  /notifies:
    get:
      description: Getting notifies of one category (without category_id - notifies
        without a category)
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Category id
        in: query
        name: category_id
        type: integer
      - description: Page number, from 1
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of notifies
          schema:
            $ref: '#/definitions/schemas.EmberNotifies'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Getting notifies
      tags:
      - Notify
    post:
      consumes:
      - application/json
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Notify
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.NotifyParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.EmberNotify'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Create notify
      tags:
      - Notify
  /notifies/{id}:
    delete:
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Notify id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.EmberNotify'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Delete notify
      tags:
      - Notify
    get:
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Notify id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.EmberNotify'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Getting notify
      tags:
      - Notify
    put:
      consumes:
      - application/json
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Notify id
        in: path
        name: id
        required: true
        type: integer
      - description: Notify
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.NotifyParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.EmberNotify'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Update notify
      tags:
      - Notify
  /notifies/delete_by_category_id:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Category
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.NotifyCategoryParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_utils.StatusResponse'
      summary: Delete notifies of category
      tags:
      - Notify
  /notifies/reset_from_category_id:
    put:
      consumes:
      - application/json
      description: Notifies of the category stay alive but lose the category
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Category
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/schemas.NotifyCategoryParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_utils.StatusResponse'
      summary: Remove notifies from category
      tags:
      - Notify
  /sessions:
    get:
      description: Getting sessions which user created
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of sessions
          schema:
            $ref: '#/definitions/schemas.EmberSessions'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Getting sessions
      tags:
      - Session
  /sessions/{id}:
    delete:
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: Session id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.EmberSessions'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Delete session
      tags:
      - Session
  /systems:
    get:
      description: Getting systems available for sending
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of systems
          schema:
            $ref: '#/definitions/schemas.EmberSystems'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api_utils.ErrorResponse'
      summary: Getting systems
      tags:
      - System
  /systems/{id}:
    get:
      parameters:
      - description: Session token
        in: header
        name: Session
        required: true
        type: string
      - description: System id
        in: path
        name: id
        required: true
        type: integer
      produces:
